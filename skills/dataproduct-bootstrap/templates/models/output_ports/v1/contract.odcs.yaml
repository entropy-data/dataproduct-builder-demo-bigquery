# dataproduct-builder:stub: written by dataproduct-bootstrap because the output port had no
# published data contract yet. dataproduct-implement replaces this file with the published contract.
apiVersion: v3.1.0
kind: DataContract

id: "{{CONTRACT_ID}}"
name: "{{DATA_PRODUCT_NAME}}"
version: 1.0.0
status: draft

description:
  usage: analytics
  purpose: "{{PURPOSE}}"

schema:
  - name: "{{TABLE}}"
    physicalName: "{{TABLE}}"
    physicalType: table
    properties:
      - name: id
        description: Primary key.
        logicalType: string
        physicalType: STRING
        required: true
        primaryKey: true
      - name: updated_at
        description: Timestamp when this record was written by dbt.
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true

team:
  name: "{{TEAM_NAME}}"

servers:
  - server: {{CONTRACT_SERVER}}
    type: bigquery
    environment: prod
    project: "{{PROJECT}}"
    dataset: "{{DATASET}}"
    customProperties:
      - property: location
        value: "{{LOCATION}}"
